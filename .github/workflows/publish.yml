name: Publish to PyPI

on:
  release:
    types: [published]

env:
  SOURCE_FILE: ./s3syncy/__init__.py
  REGEX_PATTERN: __version__\s*=\s*"(.*)"
  PYTHON_VERSION: "3.10"

jobs:
  # Job 1 — extract __version__ from source and verify it matches the release tag
  get-version:
    name: Get and verify package version
    runs-on: ubuntu-latest
    outputs:
      package-version: ${{ steps.regex.outputs.group1 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Read version file
        id: read-file
        uses: juliangruber/read-file-action@v1
        with:
          path: ${{ env.SOURCE_FILE }}

      - name: Extract version with regex
        id: regex
        uses: kaisugi/action-regex-match@v1.0.1
        with:
          text: ${{ steps.read-file.outputs.content }}
          regex: ${{ env.REGEX_PATTERN }}
          flags: gim

      - name: Cancel if version string not found in source file
        if: ${{ steps.regex.outputs.group1 == '' }}
        uses: andymckay/cancel-action@0.5

      - name: Cancel if release is not a tagged commit
        if: ${{ github.ref_type != 'tag' }}
        uses: andymckay/cancel-action@0.5

      - name: Cancel if release tag does not match source version
        if: ${{ github.ref_name != steps.regex.outputs.group1 }}
        uses: andymckay/cancel-action@0.5

      # Give the cancellation actions above enough time to propagate
      - name: Wait for cancellation
        if: ${{ steps.regex.outputs.group1 == '' || github.ref_type != 'tag' || github.ref_name != steps.regex.outputs.group1 }}
        run: sleep 60

  # Job 2 — build the distribution once; both publish jobs reuse this artifact
  # (keeps the privileged OIDC publish jobs isolated from build scripts)
  build:
    name: Build distribution
    needs: get-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check distribution metadata
        run: |
          pip install twine
          twine check dist/*

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Job 3 — always publish to PyPI Test (both releases and pre-releases)
  deploy-to-pypi-test:
    name: Deploy to PyPI Test
    needs: [get-version, build]
    runs-on: ubuntu-latest
    environment:
      name: release-test
      url: https://test.pypi.org/p/s3syncy
    permissions:
      id-token: write
      actions: read

    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@v4.1.3
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI Test
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          verbose: true

  # Job 4 — publish to production PyPI only for full (non-pre) releases
  deploy-to-pypi-prod:
    name: Deploy to PyPI
    needs: [get-version, build, deploy-to-pypi-test]
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/p/s3syncy
    permissions:
      id-token: write

    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@v4.1.3
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true


